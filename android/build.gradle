apply plugin: 'com.android.library'

group = 'expo.modules.mediaedit'
version = '0.12.1'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Manage the Android SDK versions ourselves rather than inheriting from
// expo-modules-core, since we depend on min/target SDK ≥ 26 for the
// media-edit APIs (MediaCodec async callbacks, ExoPlayer 2.x).
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 26)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.mediaedit"
  defaultConfig {
    versionCode 1
    versionName "0.12.1"
  }
  lintOptions {
    abortOnError false
  }
}
