apply plugin: 'com.android.library'

group = 'expo.modules.mediaedit'
version = '0.15.1'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// 0.14.0: Android SDK 26+ baseline kept; we now also pull in
// androidx.media3 (transformer + effect + exoplayer + ui) which
// drives the new Project-based composer and CompositionPlayer-backed
// MediaPreview view. Replaces the hand-rolled MediaCodec/MediaMuxer
// pipeline from 0.13.x.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 26)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.mediaedit"
  defaultConfig {
    versionCode 1
    versionName "0.15.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  def media3Version = "1.5.1"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-effect:${media3Version}"
  implementation "androidx.media3:media3-transformer:${media3Version}"
}
